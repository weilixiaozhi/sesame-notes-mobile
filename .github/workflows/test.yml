name: Test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.2"
  NODE_VERSION: "24.22.1"

jobs:
  test:
    name: Flutter Test (randomized order)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 格式检查（新增代码必须 dart format 合规）
        run: dart format --output=none --set-exit-if-changed .

      - name: 静态分析（仓库约定零告警）
        run: flutter analyze --no-pub

      - name: 架构边界检查
        run: dart scripts/audit/architecture.dart

      - name: API 契约固定测试（契约哈希与乐观锁约定）
        run: |
          python3 scripts/test/api_contract_test.py

      - name: 运行测试（随机顺序，持续暴露顺序依赖）
        run: flutter test test --test-randomize-ordering-seed=random

      - name: OpenAPI 生成一致性校验（生成代码不手工编辑）
        shell: pwsh
        run: |
          # 重新生成 + build_runner 后与已提交输出 diff；不一致（手改生成代码
          # 或契约漂移）即失败。需 Docker（ubuntu-latest 自带）。
          ./scripts/openapi/generate_api_client.ps1 -Check

  package_self_check:
    name: Package Self Check (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - sesame_api_client
          - sesame_cloud_backup
          - sesame_cloud_backup_s3
          - sesame_cloud_backup_supabase
          - sesame_cloud_backup_webdav
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 依赖、分析与测试
        working-directory: packages/${{ matrix.package }}
        run: |
          flutter pub get
          flutter analyze --no-pub
          if [ "${{ matrix.package }}" != "sesame_api_client" ]; then
            flutter test --no-pub
          fi

name: sesame_notes
description: "Sesame Notes - 芝麻记"
publish_to: 'none'
version: 1.4.16+34

environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2

  # drift 与 drift_dev 必须配套固定，保持 2.34.0 组合，
  # schema 工具与代码生成均可用。
  drift: 2.34.0

  # 本地备份通过 SQLite 只读连接执行 PRAGMA 完整性校验。
  sqlite3: ^3.5.1

  path_provider: ^2.1.4
  path: ^1.9.0

  # 版本同时受 flutter_localizations 的依赖约束。
  intl: ^0.20.0

  decimal: ^3.0.0
  fl_chart: ^1.2.0
  shared_preferences: ^2.3.2
  csv: ^8.0.0
  file_picker: ^12.2.0
  crypto: ^3.0.5
  uuid: ^4.5.1
  flutter_svg: ^2.0.10+1

  # Lucide 图标库（ISC 许可免署名）：全站 UI 图标与分类图标的统一来源，
  # 单色描边字形，用法与 Material Icons 一致（Icon(LucideIcons.x, color:)）。
  lucide_icons_flutter: ^3.1.15

  http: ^1.2.2

  share_plus: ^13.3.0

  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_list_view: ^1.1.29
  visibility_detector: ^0.4.0+2
  reorderable_grid_view: ^2.2.8
  excel: ^4.0.6
  image_picker: ^1.1.2
  gbk_codec: ^0.4.0
  sesame_cloud_backup:
    path: packages/sesame_cloud_backup
  sesame_cloud_backup_supabase:
    path: packages/sesame_cloud_backup_supabase
  sesame_cloud_backup_webdav:
    path: packages/sesame_cloud_backup_webdav
  sesame_cloud_backup_s3:
    path: packages/sesame_cloud_backup_s3
  table_calendar: ^3.1.0
  local_auth: ^3.0.2
  sesame_api_client:
    path: packages/sesame_api_client
  flutter_secure_storage: ^11.0.0

  # 生成 API client 的运行时依赖：同步层直接构造 AnyOf/BuiltList/Serializer。
  # one_of_serializer 由 sesame_api_client 自声明，此处仅保留 lib 直接引用的三个。
  built_collection: ^5.1.1
  built_value: ^8.9.2
  one_of: ^1.5.0

  # API 封装与同步服务使用的 HTTP 引擎。
  dio: ^5.7.0

  # WebSocket 只通知有新变更，数据仍通过 Pull 游标拉取。
  web_socket_channel: ^3.0.1
  go_router: ^17.5.0
  package_info_plus: ^10.2.1
  tyme: 1.5.0
  flutter_quill: ^11.5.1
  pdf: 3.12.0
  archive: 3.6.1
  xml: 6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

  # 与 drift 2.34.0 配套；勿单独升级到 ≥2.34.1（见上方 drift 注释）。
  build_runner: ^2.15.1
  drift_dev: 2.34.0

  # Testing framework enhancements
  mocktail: ^1.0.4
  # 测试时钟控制：防抖/定时器行为用受控时间推进，避免真实等待
  fake_async: ^1.3.3
  # 应用锁回归统计实际偏好存储写入，复用现有平台接口版本。
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  generate: true
  # 由 Flutter 合并进随应用分发的许可清单，保留第三方原文与媒体授权范围。
  licenses:
    - THIRD_PARTY_NOTICES.txt
    - third_party/exercises-dataset/LICENSE
    - third_party/exercises-dataset/NOTICE.md
    - assets/memos/OFL-CJK.txt
    - assets/memos/OFL-Emoji.txt
  assets:
    - assets/app_logo.svg
    - assets/Default avatar.png
    - assets/memos/
    - assets/fitness/
    - assets/fitness/videos/

# 重新生成应用启动图标（修改 pubspec 的 flutter_launcher_icons 配置后执行）
#   flutter pub run flutter_launcher_icons
# 说明：flutter_launcher_icons 仅支持位图，源 SVG 需先栅格化：
#   flutter test scripts/launcher_icons/rasterize_svg.dart
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/flutter_launcher_icons/launcher_legacy.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/flutter_launcher_icons/adaptive_foreground.png
  # 13% 内缩与 SVG 自身留白共同决定可见范围；换图后需检查各遮罩下的裁切。
  adaptive_icon_foreground_inset: 13
  adaptive_icon_monochrome: assets/flutter_launcher_icons/adaptive_foreground.png
  adaptive_icon_monochrome_inset: 13
